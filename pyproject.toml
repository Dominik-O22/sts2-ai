[project]
name = "sts2ai"
version = "0.1.0"
description = "Training and play loop for the StS2 Ironclad agent"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "torch>=2.8",
    "tensorboard>=2.18",
]

[dependency-groups]
dev = ["ruff>=0.16"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The Rust extension `sts2ai._sim` comes from sim-py/, the Python package
# from py/sts2ai/.
[tool.maturin]
python-source = "py"
module-name = "sts2ai._sim"
manifest-path = "sim-py/Cargo.toml"
features = ["pyo3/extension-module"]

# Rebuild the extension when the Rust side changes.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "sim/src/**/*.rs" },
    { file = "sim-py/src/**/*.rs" },
]

# `uv run ruff check` and `uv run ruff format`. Speed and accuracy come
# before any lint: where a rule would slow a hot path, keep the fast code
# and silence the rule on that line with `# noqa: CODE (why)`. Short named
# lambdas are kept on purpose (E731), and run dates are days, so naive
# datetimes are fine (DTZ).
[tool.ruff]
line-length = 160
src = ["py", "scripts"]

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["E731", "DTZ"]
