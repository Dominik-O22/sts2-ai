[package]
name = "sts2-sim-py"
version = "0.1.0"
edition.workspace = true

# Python extension module `sts2ai._sim`, built by maturin from the root
# pyproject.toml.
[lib]
name = "_sim"
crate-type = ["cdylib"]

[dependencies]
sim = { package = "sts2-sim", path = "../sim" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
serde_json = "1.0.151"
mimalloc = "0.1"
